name: OTA Update - Development

on:
  push:
    branches:
      - development
    paths:
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'modules/**'
      - 'app.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to development
        run: |
          npx eas update --branch development --message "CI: ${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
