name: OTA Update - Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'src/**' # запуск только при изменениях в src
      - 'app.json'
      - 'assets/**'
      - 'modules/**'

jobs:
  update-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting (опционально)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Publish OTA update to staging
        run: |
          npx eas update --branch staging --message "CI: ${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
